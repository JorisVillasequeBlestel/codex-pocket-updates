<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="codex-runtime-version" content="1.1.1">
  <meta name="codex-minimum-native-build" content="21">
  <meta name="codex-bridge-schema" content="2">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'">
  <title>Codex Pocket</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #f6f5f1;
      --card: #fff;
      --text: #111317;
      --quiet: rgba(61,66,77,.64);
      --line: rgba(30,36,43,.09);
      --blue: #1f61eb;
      --mint: #14a366;
      --orange: #ff8b23;
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    body { overflow: hidden; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    #app { height: 100vh; overflow: hidden; }
    .screen { height: 100%; overflow-y: auto; overscroll-behavior-y: contain; padding: 12px 18px calc(94px + var(--safe-bottom)); }
    .header { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
    .mark { width: 34px; height: 34px; border: 3px solid var(--blue); border-radius: 50%; position: relative; flex: none; }
    .mark::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); right: -4px; top: -3px; box-shadow: 0 0 9px rgba(20,163,102,.45); }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: 1.6px; }
    .device { color: var(--quiet); font-size: 11px; font-weight: 600; margin-top: 3px; }
    .online-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--mint); margin-right: 5px; }
    .grow { flex: 1; }
    .icon-button { border: 0; background: var(--card); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); font-size: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
    .search { height: 46px; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 15px; padding: 0 14px; color: var(--text); font-size: 14px; outline: none; margin-bottom: 22px; }
    .search:focus { border-color: rgba(31,97,235,.32); box-shadow: 0 0 0 3px rgba(31,97,235,.08); }
    .section-head { display: flex; align-items: baseline; margin: 0 0 7px; }
    .section-title { font-size: 20px; font-weight: 750; letter-spacing: -.4px; }
    .section-count { margin-left: auto; color: var(--quiet); font-size: 11px; font-weight: 600; }
    .section-gap { height: 25px; }
    .row { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; display: flex; align-items: center; gap: 12px; padding: 13px 0; text-align: left; }
    .row-main { min-width: 0; flex: 1; }
    .row-title { font-size: 15px; font-weight: 680; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-sub { color: var(--quiet); font-size: 10px; font-weight: 560; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .active .row-sub { color: var(--mint); }
    .chevron { color: var(--quiet); font-size: 20px; font-weight: 400; }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.4px solid rgba(31,97,235,.18); border-top-color: var(--blue); position: relative; flex: none; animation: spin 1.1s linear infinite; }
    .spinner::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); top: -3px; right: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .idle-dot { width: 18px; height: 18px; display: grid; place-items: center; flex: none; }
    .idle-dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .folder-icon { width: 28px; height: 23px; border: 2px solid currentColor; border-radius: 5px; color: rgba(24,29,35,.67); position: relative; flex: none; }
    .folder-icon::before { content: ""; position: absolute; left: 1px; top: -6px; width: 13px; height: 6px; border: 2px solid currentColor; border-bottom: 0; border-radius: 4px 4px 0 0; }
    .folder-open .folder-icon { color: var(--blue); background: rgba(31,97,235,.08); }
    .badge { color: var(--quiet); font-size: 11px; font-weight: 700; }
    .active-badge { color: var(--mint); display: flex; gap: 5px; align-items: center; }
    .folder-threads { padding-left: 39px; }
    .folder-threads .row { padding: 11px 0; }
    .empty { color: var(--quiet); font-size: 12px; padding: 15px 0 15px 39px; }
    .runtime-note { color: rgba(61,66,77,.42); font-size: 9px; text-align: center; margin: 22px 0 0; }
    .thread-screen { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .thread-head { min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 5px 12px; border-bottom: 1px solid var(--line); background: rgba(246,245,241,.96); }
    .back { border: 0; background: var(--card); width: 38px; height: 38px; border-radius: 50%; font-size: 25px; line-height: 1; }
    .thread-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 730; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
    .thread-status { width: 38px; display: flex; justify-content: center; }
    .messages { flex: 1; overflow-y: auto; padding: 18px 17px 20px; }
    .message { font-size: 14px; line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 16px; }
    .message.user { margin-left: 42px; padding: 11px 14px; border-radius: 17px; background: rgba(31,97,235,.14); }
    .message.agent { margin-right: 18px; }
    .message.operation { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; color: var(--quiet); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; max-height: 190px; overflow: auto; }
    .operation-title { color: var(--blue); font-weight: 750; margin-bottom: 7px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; }
    .live { display: flex; gap: 9px; color: var(--text); }
    .live::before { content: ""; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--blue); animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { to { opacity: .25; transform: scale(.72); } }
    .working { color: var(--mint); font-size: 10px; font-weight: 650; padding: 5px 16px 0; display: flex; align-items: center; gap: 7px; }
    .working .spinner { width: 15px; height: 15px; }
    .composer { background: rgba(246,245,241,.96); border-top: 1px solid var(--line); padding: 8px 11px calc(8px + var(--safe-bottom)); }
    .composer-meta { display: flex; align-items: center; gap: 7px; min-height: 28px; margin-bottom: 7px; overflow-x: auto; scrollbar-width: none; }
    .composer-meta::-webkit-scrollbar { display: none; }
    .composer-pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 10px; color: var(--quiet); font-size: 10px; font-weight: 700; white-space: nowrap; }
    .composer-pill.primary { color: var(--blue); border-color: rgba(31,97,235,.18); }
    .keyboard-down { display: none; margin-left: auto; color: var(--blue); }
    .composer.keyboard-open .keyboard-down { display: block; }
    .submission { min-height: 18px; margin: 2px 4px 6px; font-size: 10px; font-weight: 650; color: var(--quiet); }
    .submission.sending { color: var(--blue); }
    .submission.accepted { color: var(--mint); }
    .submission.failed { color: #b3261e; }
    .composer-row { display: flex; align-items: flex-end; gap: 8px; }
    .composer textarea { flex: 1; min-height: 44px; max-height: 130px; resize: none; border: 0; outline: 0; background: var(--card); border-radius: 18px; padding: 12px 14px; color: var(--text); font-size: 14px; }
    .round { border: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 17px; }
    .voice { background: var(--card); color: var(--blue); border: 1px solid rgba(31,97,235,.15); }
    .voice.listening { background: var(--mint); color: white; animation: breathe .8s ease-in-out infinite alternate; }
    @keyframes breathe { to { transform: scale(1.06); } }
    .send { background: var(--blue); color: white; font-size: 22px; }
    .send:disabled { opacity: .25; }
    .send .spinner { width: 18px; height: 18px; border-color: rgba(255,255,255,.35); border-top-color: white; }
    .loading { height: 100%; display: grid; place-items: center; color: var(--quiet); font-size: 13px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(10,13,17,.28); display: flex; align-items: flex-end; }
    .modal { width: 100%; background: var(--ink); border-radius: 24px 24px 0 0; padding: 20px 18px calc(20px + var(--safe-bottom)); box-shadow: 0 -20px 50px rgba(0,0,0,.16); }
    .modal.scrollable { max-height: 82vh; overflow-y: auto; }
    .modal h2 { margin: 0 0 16px; font-size: 22px; }
    .field { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 11px; color: var(--text); }
    textarea.field { min-height: 110px; resize: vertical; }
    .modal-actions { display: flex; gap: 9px; margin-top: 7px; }
    .modal-actions button { flex: 1; border: 0; border-radius: 14px; padding: 13px; font-weight: 700; }
    .cancel { background: var(--card); }
    .create { background: var(--blue); color: white; }
    .option-label { color: var(--quiet); font-size: 10px; font-weight: 800; letter-spacing: .7px; margin: 12px 2px 6px; text-transform: uppercase; }
    .tool-option { display: flex; align-items: flex-start; gap: 11px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
    .tool-option input { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--blue); }
    .tool-name { font-size: 13px; font-weight: 750; }
    .tool-description { color: var(--quiet); font-size: 10px; line-height: 1.35; margin-top: 3px; }
    .fatal { padding: 30px; text-align: center; color: #b3261e; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
  (() => {
    'use strict';
    const meta = name => document.querySelector(`meta[name="${name}"]`)?.content || '';
    const runtimeVersion = meta('codex-runtime-version');
    const bridgeSchema = Number(meta('codex-bridge-schema'));
    const state = {
      data: null,
      route: { name: 'home' },
      expanded: new Set(),
      search: '',
      drafts: {},
      modal: null,
      composerSettings: {},
      pendingSubmissions: {},
      lastDictation: '',
      threadScroll: new Map()
    };
    const app = document.getElementById('app');
    const post = (type, payload = {}) => {
      try { window.webkit.messageHandlers.codexPocket.postMessage({ type, ...payload }); } catch (_) {}
    };
    const node = (tag, className, text) => {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined && text !== null) element.textContent = String(text);
      return element;
    };
    const button = (className, label, action) => {
      const element = node('button', className);
      element.type = 'button';
      element.setAttribute('aria-label', label);
      element.addEventListener('click', action);
      return element;
    };
    const activeIndicator = active => node('span', active ? 'spinner' : 'idle-dot');
    const sortedThreads = threads => [...threads].sort((a, b) => Number(b.active) - Number(a.active) || b.updatedAt - a.updatedAt || a.id.localeCompare(b.id));
    const threadsFor = project => sortedThreads((state.data?.threads || []).filter(thread => thread.projectId === project.id || thread.cwd === project.cwd));

    function render() {
      if (!state.modal) app.querySelector(':scope > .modal-backdrop')?.remove();
      if (!state.data) {
        app.replaceChildren(node('div', 'loading', 'Connexion sécurisée au Mac…'));
        return;
      }
      if (state.data.bridgeSchema !== bridgeSchema) {
        app.replaceChildren(node('div', 'fatal', 'Cette interface nécessite une mise à jour du shell natif.'));
        return;
      }
      if (state.route.name === 'thread') renderThread();
      else renderHome();
      if (state.modal) renderModal();
    }

    function renderHome() {
      const existing = app.querySelector(':scope > .home-screen');
      if (existing) {
        const device = existing.querySelector('.device');
        if (device) renderDevice(device);
        renderHomeInto(existing);
        return;
      }
      const screen = node('section', 'screen home-screen');
      const header = node('header', 'header');
      header.append(node('span', 'mark'));
      const identity = node('div');
      identity.append(node('div', 'eyebrow', 'CODEX POCKET'));
      const device = node('div', 'device');
      renderDevice(device);
      identity.append(device);
      header.append(identity, node('span', 'grow'));
      const createButton = button('icon-button', 'Nouvelle discussion', () => { state.modal = { type: 'newThread' }; render(); });
      createButton.textContent = '✎';
      header.append(createButton);
      screen.append(header);

      const search = node('input', 'search');
      search.type = 'search';
      search.placeholder = 'Rechercher un projet ou une discussion';
      search.value = state.search;
      search.addEventListener('input', event => { state.search = event.target.value; renderHomeInto(screen); });
      screen.append(search);
      renderHomeInto(screen);
      app.replaceChildren(screen);
    }

    function renderDevice(device) {
      device.replaceChildren(
        node('span', 'online-dot'),
        document.createTextNode(`${state.data.deviceName} · Connecté · v${runtimeVersion}`)
      );
    }

    function renderHomeInto(screen) {
      while (screen.children.length > 2) screen.lastElementChild.remove();
      const query = state.search.trim().toLocaleLowerCase('fr');
      const allThreads = sortedThreads(state.data.threads || []);
      const active = allThreads.filter(thread => thread.active && (!query || `${thread.name} ${thread.projectName}`.toLocaleLowerCase('fr').includes(query)));
      if (active.length) {
        screen.append(sectionHeader('En mouvement', `${active.length} discussion${active.length > 1 ? 's' : ''}`));
        active.forEach(thread => screen.append(threadRow(thread, true)));
        screen.append(node('div', 'section-gap'));
      }
      if (query) {
        const matches = allThreads.filter(thread => `${thread.name} ${thread.projectName}`.toLocaleLowerCase('fr').includes(query));
        screen.append(sectionHeader('Discussions', `${matches.length} résultat${matches.length > 1 ? 's' : ''}`));
        matches.forEach(thread => screen.append(threadRow(thread, false)));
        screen.append(node('div', 'section-gap'));
      }
      const projects = (state.data.projects || []).filter(project => !query || `${project.name} ${project.cwd}`.toLocaleLowerCase('fr').includes(query));
      screen.append(sectionHeader('Projets Codex', `${projects.length} projets`));
      projects.forEach(project => screen.append(projectBlock(project)));
      screen.append(node('div', 'runtime-note', `Interface évolutive sécurisée · runtime ${runtimeVersion}`));
    }

    function sectionHeader(title, count) {
      const head = node('div', 'section-head');
      head.append(node('div', 'section-title', title), node('div', 'section-count', count));
      return head;
    }

    function threadRow(thread, emphasize) {
      const row = button(`row${thread.active ? ' active' : ''}`, `Ouvrir ${thread.name}`, () => openThread(thread.id));
      row.append(activeIndicator(thread.active));
      const main = node('div', 'row-main');
      main.append(node('div', 'row-title', thread.name));
      const subtitle = emphasize && thread.active ? `${thread.projectName} · Codex travaille` : thread.projectName;
      main.append(node('div', 'row-sub', subtitle));
      row.append(main, node('span', 'chevron', '›'));
      return row;
    }

    function projectBlock(project) {
      const block = node('div', state.expanded.has(project.id) ? 'folder-open' : '');
      const row = button('row', `${state.expanded.has(project.id) ? 'Fermer' : 'Ouvrir'} ${project.name}`, () => {
        if (state.expanded.has(project.id)) state.expanded.delete(project.id);
        else { state.expanded.add(project.id); post('loadProject', { projectId: project.id }); }
        render();
      });
      row.append(node('span', 'folder-icon'));
      const main = node('div', 'row-main');
      main.append(node('div', 'row-title', project.name), node('div', 'row-sub', 'Projet Codex'));
      row.append(main);
      if (project.activeCount > 0) {
        const badge = node('span', 'badge active-badge');
        badge.append(activeIndicator(true), document.createTextNode(String(project.activeCount)));
        row.append(badge);
      }
      if (project.threadCount > 0) row.append(node('span', 'badge', project.threadCount));
      row.append(node('span', 'chevron', state.expanded.has(project.id) ? '⌄' : '›'));
      block.append(row);
      if (state.expanded.has(project.id)) {
        const container = node('div', 'folder-threads');
        const threads = threadsFor(project);
        if (!threads.length) container.append(node('div', 'empty', 'Chargement des discussions…'));
        else threads.forEach(thread => container.append(threadRow(thread, false)));
        block.append(container);
      }
      return block;
    }

    function openThread(threadId) {
      state.threadScroll.delete(threadId);
      state.route = { name: 'thread', id: threadId };
      post('openThread', { threadId });
      render();
    }

    function renderThread() {
      const thread = state.data.selectedThread?.id === state.route.id ? state.data.selectedThread : null;
      const existing = app.querySelector(':scope > .thread-screen');
      if (
        thread
        && existing?.dataset.threadId === thread.id
        && existing.querySelector('.messages')
        && existing.querySelector('.composer textarea')
      ) {
        updateThreadScreen(existing, thread);
        return;
      }
      const screen = node('section', 'thread-screen');
      screen.dataset.threadId = state.route.id;
      const head = node('header', 'thread-head');
      const back = button('back', 'Retour', () => { state.route = { name: 'home' }; post('stopDictation'); render(); });
      back.textContent = '‹';
      head.append(back, node('div', 'thread-name', thread?.name || 'Discussion'));
      const status = node('div', 'thread-status');
      if (thread?.active) status.append(activeIndicator(true));
      head.append(status);
      screen.append(head);
      if (!thread) {
        screen.append(node('div', 'loading', 'Chargement de la discussion…'));
        app.replaceChildren(screen);
        return;
      }
      const messages = node('div', 'messages');
      renderMessages(messages, thread);
      screen.append(messages);
      const working = createWorking(thread);
      if (working) screen.append(working);
      screen.append(createComposer(thread));
      app.replaceChildren(screen);
      const savedScroll = state.threadScroll.get(thread.id);
      messages.addEventListener('scroll', () => rememberThreadScroll(thread.id, messages), { passive: true });
      restoreThreadScroll(thread.id, messages, savedScroll);
    }

    function renderMessages(messages, thread) {
      messages.replaceChildren();
      thread.messages.forEach(message => {
        const item = node('article', `message ${message.kind}`);
        if (message.title) item.append(node('div', 'operation-title', message.title));
        item.append(document.createTextNode(message.text));
        messages.append(item);
      });
      if (thread.liveText) messages.append(node('div', 'message agent live', thread.liveText));
    }

    function createWorking(thread) {
      if (!thread.active) return null;
      const working = node('div', 'working');
      working.append(activeIndicator(true), document.createTextNode('Codex travaille sur le Mac'));
      if (thread.canInterrupt) {
        const stop = button('', 'Arrêter Codex', () => post('interrupt', { threadId: thread.id }));
        stop.textContent = 'Arrêter';
        stop.style.cssText = 'margin-left:auto;border:0;background:transparent;color:#1f61eb;font-size:10px;font-weight:700';
        working.append(stop);
      }
      return working;
    }

    function settingsFor(thread) {
      const capabilities = thread.capabilities || { models: [], collaborationModes: [], skills: [], apps: [] };
      const current = state.composerSettings[thread.id] || {};
      const defaultModel = capabilities.models.find(model => model.isDefault) || capabilities.models[0] || null;
      const model = capabilities.models.find(option => option.id === current.model) || defaultModel;
      const efforts = model?.supportedReasoningEfforts || [];
      const effort = efforts.some(option => option.effort === current.effort)
        ? current.effort
        : model?.defaultReasoningEffort || efforts[0]?.effort || null;
      const collaborationMode = capabilities.collaborationModes.some(mode => mode.name === current.collaborationMode)
        ? current.collaborationMode
        : null;
      const skillPaths = (current.skillPaths || []).filter(path => capabilities.skills.some(skill => skill.path === path));
      const appIds = (current.appIds || []).filter(id => capabilities.apps.some(app => app.id === id));
      const next = { model: model?.id || null, effort, collaborationMode, skillPaths, appIds };
      state.composerSettings[thread.id] = next;
      return next;
    }

    function submissionStatus(thread) {
      const pending = state.pendingSubmissions[thread.id];
      const remote = thread.submission;
      if (pending && (!remote || remote.requestId !== pending.requestId || remote.phase === 'sending')) {
        return { phase: 'sending', text: 'Envoi au Mac en cours…' };
      }
      if (!remote) return null;
      if (remote.phase === 'sending') return { phase: 'sending', text: 'Le Mac transmet le prompt à Codex…' };
      if (remote.phase === 'accepted') {
        return {
          phase: 'accepted',
          text: remote.delivery === 'steered' ? 'Ajouté à l’agent en cours ✓' : 'Prompt reçu par Codex ✓'
        };
      }
      if (remote.phase === 'failed') return { phase: 'failed', text: remote.error || 'Échec de l’envoi. Le texte a été conservé.' };
      return null;
    }

    function updateSubmissionBanner(composer, thread) {
      const banner = composer.querySelector('.submission');
      if (!banner) return;
      const status = submissionStatus(thread);
      banner.className = `submission${status ? ` ${status.phase}` : ''}`;
      banner.textContent = status?.text || '';
    }

    function createComposer(thread) {
      const composer = node('div', 'composer');
      const settings = settingsFor(thread);
      const capabilities = thread.capabilities || { models: [], skills: [], apps: [] };
      const meta = node('div', 'composer-meta');
      const selectedModel = capabilities.models.find(model => model.id === settings.model);
      const modelButton = button('composer-pill primary', 'Choisir le modèle et le raisonnement', () => {
        state.modal = { type: 'model', threadId: thread.id };
        render();
      });
      modelButton.textContent = selectedModel ? `${selectedModel.displayName} · ${settings.effort || 'auto'}` : 'Chargement des modèles…';
      modelButton.disabled = !capabilities.models.length;
      const toolCount = settings.skillPaths.length + settings.appIds.length;
      const tools = button('composer-pill', 'Choisir les outils et fonctions', () => {
        state.modal = { type: 'tools', threadId: thread.id };
        render();
      });
      tools.textContent = toolCount ? `＋ Outils · ${toolCount}` : '＋ Outils';
      const keyboardDown = button('composer-pill keyboard-down', 'Masquer le clavier', () => {
        composer.querySelector('textarea')?.blur();
      });
      keyboardDown.textContent = '⌄ Clavier';
      meta.append(modelButton, tools, keyboardDown);
      const submission = node('div', 'submission');
      composer.append(meta, submission);
      const row = node('div', 'composer-row');
      const input = node('textarea');
      input.placeholder = 'Écrire à Codex…';
      input.value = state.drafts[thread.id] || '';
      input.addEventListener('input', event => { state.drafts[thread.id] = event.target.value; send.disabled = !event.target.value.trim(); });
      input.addEventListener('focus', () => composer.classList.add('keyboard-open'));
      input.addEventListener('blur', () => composer.classList.remove('keyboard-open'));
      const voice = button(`round voice${state.data.dictationActive ? ' listening' : ''}`, state.data.dictationActive ? 'Arrêter la dictée' : 'Démarrer la dictée', () => post('toggleDictation'));
      voice.textContent = state.data.dictationActive ? '≋' : '●';
      const send = button('round send', 'Envoyer', () => {
        const text = (state.drafts[thread.id] || '').trim();
        if (!text) return;
        const currentSettings = settingsFor(thread);
        const requestId = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        state.pendingSubmissions[thread.id] = { requestId, text };
        send.disabled = true;
        send.replaceChildren(activeIndicator(true));
        updateSubmissionBanner(composer, thread);
        post('send', {
          threadId: thread.id,
          text,
          requestId,
          model: currentSettings.model,
          effort: currentSettings.effort,
          collaborationMode: currentSettings.collaborationMode,
          skillPaths: currentSettings.skillPaths,
          appIds: currentSettings.appIds
        });
      });
      send.textContent = '↑';
      send.disabled = !input.value.trim() || Boolean(state.pendingSubmissions[thread.id]);
      row.append(input, voice, send);
      composer.append(row);
      updateSubmissionBanner(composer, thread);
      return composer;
    }

    function updateThreadScreen(screen, thread) {
      const messages = screen.querySelector('.messages');
      const currentScroll = threadScrollSnapshot(messages);
      const name = screen.querySelector('.thread-name');
      if (name) name.textContent = thread.name || 'Discussion';
      const status = screen.querySelector('.thread-status');
      if (status) status.replaceChildren(...(thread.active ? [activeIndicator(true)] : []));
      renderMessages(messages, thread);

      const currentWorking = screen.querySelector(':scope > .working');
      const nextWorking = createWorking(thread);
      if (currentWorking && nextWorking) currentWorking.replaceWith(nextWorking);
      else if (currentWorking) currentWorking.remove();
      else if (nextWorking) screen.insertBefore(nextWorking, screen.querySelector('.composer'));

      const input = screen.querySelector('.composer textarea');
      const composer = screen.querySelector('.composer');
      const voice = screen.querySelector('.composer .voice');
      const send = screen.querySelector('.composer .send');
      const draft = state.drafts[thread.id] || '';
      if (input.value !== draft) {
        const wasFocused = document.activeElement === input;
        const oldLength = input.value.length;
        const selectionStart = input.selectionStart ?? oldLength;
        const selectionEnd = input.selectionEnd ?? oldLength;
        const wasAtEnd = selectionStart === oldLength && selectionEnd === oldLength;
        input.value = draft;
        if (wasFocused) {
          const nextStart = wasAtEnd ? draft.length : Math.min(selectionStart, draft.length);
          const nextEnd = wasAtEnd ? draft.length : Math.min(selectionEnd, draft.length);
          input.setSelectionRange(nextStart, nextEnd);
        }
      }
      if (voice) {
        voice.className = `round voice${state.data.dictationActive ? ' listening' : ''}`;
        voice.setAttribute('aria-label', state.data.dictationActive ? 'Arrêter la dictée' : 'Démarrer la dictée');
        voice.textContent = state.data.dictationActive ? '≋' : '●';
      }
      const settings = settingsFor(thread);
      const selectedModel = thread.capabilities?.models?.find(model => model.id === settings.model);
      const modelButton = composer.querySelector('.composer-pill.primary');
      if (modelButton) {
        modelButton.textContent = selectedModel ? `${selectedModel.displayName} · ${settings.effort || 'auto'}` : 'Chargement des modèles…';
        modelButton.disabled = !(thread.capabilities?.models?.length);
      }
      const toolsButton = [...composer.querySelectorAll('.composer-pill')].find(button => button.getAttribute('aria-label') === 'Choisir les outils et fonctions');
      if (toolsButton) {
        const toolCount = settings.skillPaths.length + settings.appIds.length;
        toolsButton.textContent = toolCount ? `＋ Outils · ${toolCount}` : '＋ Outils';
      }
      updateSubmissionBanner(composer, thread);
      if (send) {
        const sending = Boolean(state.pendingSubmissions[thread.id]) || thread.submission?.phase === 'sending';
        send.disabled = !input.value.trim() || sending;
        if (sending) send.replaceChildren(activeIndicator(true));
        else send.textContent = '↑';
      }
      restoreThreadScroll(thread.id, messages, currentScroll);
    }

    function threadScrollSnapshot(messages) {
      const distanceFromBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight;
      return {
        top: messages.scrollTop,
        nearBottom: distanceFromBottom < 80
      };
    }

    function rememberThreadScroll(threadId, messages) {
      state.threadScroll.set(threadId, threadScrollSnapshot(messages));
    }

    function restoreThreadScroll(threadId, messages, savedScroll) {
      requestAnimationFrame(() => {
        if (!savedScroll || savedScroll.nearBottom) messages.scrollTop = messages.scrollHeight;
        else messages.scrollTop = savedScroll.top;
        rememberThreadScroll(threadId, messages);
      });
    }

    function renderModal() {
      if (app.querySelector(':scope > .modal-backdrop')) return;
      const backdrop = node('div', 'modal-backdrop');
      const modal = node('div', 'modal scrollable');
      if (state.modal.type === 'newThread') renderNewThreadModal(modal);
      else {
        const thread = state.data.selectedThread?.id === state.modal.threadId ? state.data.selectedThread : null;
        if (!thread) { state.modal = null; render(); return; }
        if (state.modal.type === 'model') renderModelModal(modal, thread);
        else if (state.modal.type === 'tools') renderToolsModal(modal, thread);
      }
      backdrop.append(modal);
      backdrop.addEventListener('click', event => { if (event.target === backdrop) closeModal(); });
      app.append(backdrop);
    }

    function closeModal() {
      state.modal = null;
      render();
    }

    function refreshModal() {
      app.querySelector(':scope > .modal-backdrop')?.remove();
      renderModal();
    }

    function modalActions(modal, confirmLabel = 'Terminé') {
      const actions = node('div', 'modal-actions');
      const close = button('create', confirmLabel, closeModal);
      close.textContent = confirmLabel;
      actions.append(close);
      modal.append(actions);
    }

    function renderNewThreadModal(modal) {
      modal.append(node('h2', '', 'Nouvelle discussion'));
      const select = node('select', 'field');
      (state.data.projects || []).forEach(project => {
        const option = node('option', '', project.name);
        option.value = project.id;
        select.append(option);
      });
      const prompt = node('textarea', 'field');
      prompt.placeholder = 'Que doit faire Codex ?';
      const actions = node('div', 'modal-actions');
      const cancel = button('cancel', 'Annuler', closeModal);
      cancel.textContent = 'Annuler';
      const create = button('create', 'Créer', () => {
        if (!select.value || !prompt.value.trim()) return;
        post('createThread', { projectId: select.value, prompt: prompt.value.trim() });
        closeModal();
      });
      create.textContent = 'Créer';
      actions.append(cancel, create);
      modal.append(select, prompt, actions);
    }

    function renderModelModal(modal, thread) {
      const capabilities = thread.capabilities || { models: [], collaborationModes: [] };
      const settings = settingsFor(thread);
      modal.append(node('h2', '', 'Modèle et raisonnement'));
      modal.append(node('div', 'option-label', 'Modèle disponible sur ce Mac'));
      const modelSelect = node('select', 'field');
      modelSelect.setAttribute('aria-label', 'Modèle Codex');
      capabilities.models.forEach(model => {
        const option = node('option', '', model.displayName);
        option.value = model.id;
        option.selected = model.id === settings.model;
        modelSelect.append(option);
      });
      modelSelect.addEventListener('change', () => {
        const selected = capabilities.models.find(model => model.id === modelSelect.value);
        state.composerSettings[thread.id] = {
          ...settings,
          model: modelSelect.value,
          effort: selected?.defaultReasoningEffort || selected?.supportedReasoningEfforts?.[0]?.effort || null
        };
        refreshModal();
      });
      modal.append(modelSelect);

      const selectedModel = capabilities.models.find(model => model.id === settings.model);
      modal.append(node('div', 'option-label', 'Niveau de raisonnement'));
      const effortSelect = node('select', 'field');
      effortSelect.setAttribute('aria-label', 'Niveau de raisonnement Codex');
      (selectedModel?.supportedReasoningEfforts || []).forEach(effort => {
        const label = effort.description ? `${effort.effort} — ${effort.description}` : effort.effort;
        const option = node('option', '', label);
        option.value = effort.effort;
        option.selected = effort.effort === settings.effort;
        effortSelect.append(option);
      });
      effortSelect.addEventListener('change', () => {
        state.composerSettings[thread.id] = { ...settings, effort: effortSelect.value || null };
      });
      modal.append(effortSelect);

      if (capabilities.collaborationModes?.length) {
        modal.append(node('div', 'option-label', 'Mode de collaboration'));
        const modeSelect = node('select', 'field');
        modeSelect.setAttribute('aria-label', 'Mode de collaboration Codex');
        const standard = node('option', '', 'Standard');
        standard.value = '';
        modeSelect.append(standard);
        capabilities.collaborationModes.forEach(mode => {
          const option = node('option', '', mode.name);
          option.value = mode.name;
          option.selected = mode.name === settings.collaborationMode;
          modeSelect.append(option);
        });
        modeSelect.addEventListener('change', () => {
          state.composerSettings[thread.id] = { ...settingsFor(thread), collaborationMode: modeSelect.value || null };
        });
        modal.append(modeSelect);
      }
      if (selectedModel?.description) modal.append(node('div', 'tool-description', selectedModel.description));
      modalActions(modal);
    }

    function renderToolsModal(modal, thread) {
      const capabilities = thread.capabilities || { skills: [], apps: [] };
      const settings = settingsFor(thread);
      modal.append(node('h2', '', 'Outils et fonctions'));
      if (!capabilities.skills.length && !capabilities.apps.length) {
        modal.append(node('div', 'empty', 'Aucun outil supplémentaire n’est disponible pour ce projet.'));
      }
      if (capabilities.skills.length) modal.append(node('div', 'option-label', 'Compétences Codex'));
      capabilities.skills.forEach(skill => {
        modal.append(toolCheckbox(
          skill.name,
          skill.description,
          settings.skillPaths.includes(skill.path),
          checked => {
            const current = settingsFor(thread);
            current.skillPaths = checked
              ? [...new Set([...current.skillPaths, skill.path])]
              : current.skillPaths.filter(path => path !== skill.path);
          }
        ));
      });
      if (capabilities.apps.length) modal.append(node('div', 'option-label', 'Apps connectées'));
      capabilities.apps.forEach(codexApp => {
        modal.append(toolCheckbox(
          codexApp.name,
          codexApp.description,
          settings.appIds.includes(codexApp.id),
          checked => {
            const current = settingsFor(thread);
            current.appIds = checked
              ? [...new Set([...current.appIds, codexApp.id])]
              : current.appIds.filter(id => id !== codexApp.id);
          }
        ));
      });
      modalActions(modal);
    }

    function toolCheckbox(name, description, checked, changed) {
      const label = node('label', 'tool-option');
      const checkbox = node('input');
      checkbox.type = 'checkbox';
      checkbox.setAttribute('aria-label', `Activer ${name}`);
      checkbox.checked = checked;
      checkbox.addEventListener('change', () => changed(checkbox.checked));
      const copy = node('div');
      copy.append(node('div', 'tool-name', name));
      if (description) copy.append(node('div', 'tool-description', description));
      label.append(checkbox, copy);
      return label;
    }

    window.CodexPocket = Object.freeze({
      receiveState(nextState) {
        if (!nextState || Number(nextState.bridgeSchema) !== bridgeSchema) return;
        const nextThread = nextState.selectedThread;
        const pending = nextThread && state.pendingSubmissions[nextThread.id];
        if (pending && nextThread.submission?.requestId === pending.requestId) {
          if (nextThread.submission.phase === 'accepted') {
            state.drafts[nextThread.id] = '';
            delete state.pendingSubmissions[nextThread.id];
          } else if (nextThread.submission.phase === 'failed') {
            state.drafts[nextThread.id] = pending.text;
            delete state.pendingSubmissions[nextThread.id];
          }
        }
        state.data = nextState;
        if (nextState.dictationText && nextState.dictationText !== state.lastDictation && state.route.name === 'thread') {
          state.lastDictation = nextState.dictationText;
          state.drafts[state.route.id] = nextState.dictationText;
        }
        render();
      }
    });
    render();
    post('ready', { runtimeVersion, bridgeSchema });
  })();
  </script>
</body>
</html>
